user root;
events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 8080;
        root /app/dist;
        index index.html;
        autoindex on;

        # Serve VocalParts JSON files directly (don't fall back to index.html)
        location /VocalParts/ {
            add_header Content-Type application/json;
            add_header Cache-Control "public, max-age=31536000";
            try_files $uri =404;
        }
        
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
